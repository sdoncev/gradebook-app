<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradebook</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./courses.js" defer></script>
  </head>
  <body>
    <div class="sidebar">
      <span class="app-title">Gradebook App</span>
    </div>
    <div class="main-content">
      <div class="hero">Courses</div>
      <div class="toolbar">
        <div class="filters-container">
          <label for="terms">Term:</label>
          <select class="term-filter" name="terms" id="terms">
            <option>All Terms</option>
          </select>
        </div>
        <div class="view-toggle-container">
          <button class="list-view-btn view-btn">
            <svg viewBox="0 0 24 24" width="24px" height="24px" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Edit / List_Unordered"> <path id="Vector" d="M9 17H19M9 12H19M9 7H19M5.00195 17V17.002L5 17.002V17H5.00195ZM5.00195 12V12.002L5 12.002V12H5.00195ZM5.00195 7V7.002L5 7.00195V7H5.00195Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g> </g></svg>
          </button>
          <button class="grid-view-btn view-btn">
            <svg viewBox="0 0 24 24" width="24px" height="24px" xmlns="http://www.w3.org/2000/svg" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <title></title> <g id="Complete"> <g id="grid"> <g> <rect fill="none" height="7" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="7" x="14.5" y="2.5"></rect> <rect fill="none" height="7" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="7" x="14.5" y="14.5"></rect> <rect fill="none" height="7" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="7" x="2.5" y="2.5"></rect> <rect fill="none" height="7" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="7" x="2.5" y="14.5"></rect> </g> </g> </g> </g></svg>
          </button>
        </div>
      </div>
      <div class="courses-list-view"></div>
    </div>
  </body>
</html>
